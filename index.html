<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yash · Data Science · ML · GenAI</title>
    <meta name="description" content="Yash Kagra — Data Science, Machine Learning, Generative AI & Analytics portfolio. B.Tech CSE, DCRUST." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Inter:opsz,wght@14..32,300..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- EmailJS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        /* ===== TOKENS ===== */
        :root {
            --bg: #090b12;
            --bg-soft: #0d101a;
            --surface: #131724;
            --surface-2: #1a1f30;
            --border: rgba(124, 92, 255, 0.15);
            --border-strong: rgba(124, 92, 255, 0.35);
            --violet: #7c5cff;
            --violet-dim: #5b3fd6;
            --violet-soft: #b6a8ff;
            --amber: #fbbf24;
            --amber-dim: #d99e1a;
            --green: #34d399;
            --red: #f87171;
            --text: #e8ebf5;
            --text-dim: #949dba;
            --text-dimmer: #5a6180;
            --mono: 'JetBrains Mono', ui-monospace, monospace;
            --sans: 'Inter', system-ui, -apple-system, sans-serif;
            --radius: 16px;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            --transition: 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            line-height: 1.6;
            overflow-x: hidden;
            font-size: 16px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 70% 45% at 10% 0%, rgba(124, 92, 255, 0.08), transparent 60%),
                radial-gradient(ellipse 60% 40% at 90% 10%, rgba(251, 191, 36, 0.05), transparent 60%),
                radial-gradient(ellipse 50% 50% at 50% 100%, rgba(124, 92, 255, 0.06), transparent 60%);
            pointer-events: none;
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.01) 0px, rgba(255, 255, 255, 0.01) 1px, transparent 1px, transparent 3px);
            pointer-events: none;
            z-index: -1;
            opacity: 0.4;
        }

        .noise {
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: 0.035;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 256px 256px;
        }

        ::selection { background: var(--violet); color: #fff; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; }

        a { color: inherit; text-decoration: none; }
        .container { max-width: 1280px; margin: 0 auto; padding: 0 2rem; }
        .mono { font-family: var(--mono); }

        /* ===== STATUS BAR ===== */
        .statusbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1100;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            font-family: var(--mono);
            font-size: 0.68rem;
            color: var(--text-dimmer);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.3rem 2rem;
            letter-spacing: 0.03em;
        }

        .statusbar .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--green);
            display: inline-block;
            margin-right: 0.45rem;
            box-shadow: 0 0 10px var(--green);
            animation: pulse 2.4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .statusbar-right { display: flex; gap: 1.6rem; }
        .statusbar-right span i { margin-right: 0.35rem; opacity: 0.6; }

        @media (max-width: 860px) {
            .statusbar-right span:not(:last-child) { display: none; }
            .statusbar { padding: 0.3rem 1rem; font-size: 0.6rem; }
        }

        /* ===== NAV ===== */
        nav {
            position: fixed;
            top: 26px; left: 0; right: 0;
            z-index: 1000;
            background: rgba(9, 11, 18, 0.82);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border);
            padding: 0.7rem 0;
        }

        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: var(--mono);
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: -0.02em;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .logo .caret {
            color: var(--amber);
            animation: blink 1.1s step-end infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            font-family: var(--mono);
            font-size: 0.75rem;
        }

        .nav-links a {
            color: var(--text-dim);
            transition: color 0.2s;
            position: relative;
        }

        .nav-links a::before { content: './'; color: var(--text-dimmer); }
        .nav-links a:hover { color: var(--amber); }

        .nav-photo, .nav-placeholder {
            width: 36px; height: 36px;
            border-radius: 8px;
            object-fit: cover;
            border: 1.5px solid var(--border-strong);
        }

        .nav-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface-2);
            font-family: var(--mono);
            font-weight: 700;
            color: var(--violet-soft);
            font-size: 0.7rem;
        }

        .nav-cta {
            font-family: var(--mono);
            font-size: 0.7rem;
            background: var(--amber);
            color: #151208;
            padding: 0.35rem 0.9rem;
            border-radius: 6px;
            font-weight: 600;
            transition: 0.2s;
        }

        .nav-cta:hover { background: var(--amber-dim); transform: translateY(-1px); }

        @media (max-width: 860px) {
            .nav-links { display: none; }
            nav { top: 22px; }
        }

        /* ===== HERO ===== */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            gap: 4rem;
            padding-top: 120px;
            padding-bottom: 3rem;
            flex-wrap: wrap;
        }

        .hero-left { flex: 1.1; min-width: 320px; }
        .hero-eyebrow {
            font-family: var(--mono);
            font-size: 0.7rem;
            color: var(--green);
            letter-spacing: 0.08em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.2rem;
        }

        .hero-eyebrow .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 10px var(--green);
        }

        .hero h1 {
            font-family: var(--mono);
            font-weight: 700;
            font-size: clamp(2.8rem, 6.5vw, 4.8rem);
            line-height: 1.05;
            letter-spacing: -0.02em;
            margin-bottom: 0.8rem;
        }

        .hero h1 .accent {
            background: linear-gradient(120deg, var(--violet-soft), var(--amber));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .hero-role {
            font-family: var(--mono);
            font-size: 1.05rem;
            color: var(--text-dim);
            min-height: 1.8rem;
            margin-bottom: 1rem;
        }

        .hero-role .cursor {
            color: var(--amber);
            animation: blink 0.9s step-end infinite;
        }

        .hero-desc {
            color: var(--text-dim);
            max-width: 520px;
            font-size: 1rem;
            margin-bottom: 1.8rem;
        }

        .hero-desc strong { color: var(--text); font-weight: 600; }
        .hero-desc .highlight { color: var(--violet-soft); }

        .hero-btns {
            display: flex;
            gap: 0.9rem;
            flex-wrap: wrap;
            margin-bottom: 2.4rem;
        }

        .btn {
            font-family: var(--mono);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
            border: 1px solid transparent;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--amber);
            color: #151208;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(251, 191, 36, 0.2);
        }

        .btn-outline {
            border-color: var(--border-strong);
            color: var(--text-dim);
            background: rgba(255, 255, 255, 0.02);
        }

        .btn-outline:hover {
            border-color: var(--violet-soft);
            color: var(--text);
        }

        .btn-resume {
            border-color: var(--violet);
            color: var(--violet-soft);
            background: rgba(124, 92, 255, 0.06);
        }

        .btn-resume:hover {
            background: rgba(124, 92, 255, 0.15);
            border-color: var(--violet-soft);
        }

        .hero-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.9rem;
            max-width: 560px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.8rem 0.5rem;
            text-align: center;
            transition: 0.2s;
        }

        .stat-card:hover { border-color: var(--border-strong); }

        .stat-num {
            font-family: var(--mono);
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--amber);
        }

        .stat-label {
            font-size: 0.6rem;
            color: var(--text-dimmer);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 0.1rem;
        }

        /* ===== TERMINAL ===== */
        .term-window {
            flex: 0.9;
            min-width: 300px;
            max-width: 520px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .term-bar {
            background: var(--surface-2);
            padding: 0.6rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        .term-dot { width: 10px; height: 10px; border-radius: 50%; }
        .term-dot.r { background: #ff5f57; }
        .term-dot.y { background: #febc2e; }
        .term-dot.g { background: #28c840; }

        .term-title {
            font-family: var(--mono);
            font-size: 0.7rem;
            color: var(--text-dimmer);
            margin-left: 0.4rem;
        }

        .term-body {
            padding: 1.2rem 1.3rem;
            font-family: var(--mono);
            font-size: 0.8rem;
            line-height: 1.9;
            min-height: 280px;
        }

        .term-body .ln-cmd { color: var(--violet-soft); }
        .term-body .ln-cmd::before { content: '$ '; color: var(--green); }
        .term-body .ln-out { color: var(--text-dim); padding-left: 0.1rem; }
        .term-body .k { color: var(--amber); }
        .term-body .s { color: #7dd3fc; }
        .term-body .ln-yaml { padding-left: 1.2rem; color: var(--text-dim); }

        .term-cursor {
            display: inline-block;
            width: 7px;
            height: 1em;
            background: var(--amber);
            vertical-align: middle;
            animation: blink 0.9s step-end infinite;
        }

        @media (max-width: 860px) {
            .hero { gap: 2.5rem; padding-top: 100px; }
            .hero-stats { grid-template-columns: repeat(2, 1fr); }
            .term-window { max-width: 100%; width: 100%; }
        }

        /* ===== SECTIONS ===== */
        section { margin: 6rem 0; scroll-margin-top: 100px; }
        .sec-head {
            display: flex;
            align-items: baseline;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .sec-index {
            font-family: var(--mono);
            color: var(--text-dimmer);
            font-size: 0.8rem;
            font-weight: 500;
        }

        .sec-title {
            font-family: var(--mono);
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .sec-title .hl { color: var(--amber); }
        .sec-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border-strong), transparent);
        }

        .sec-sub {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin: -1.2rem 0 2.2rem;
            max-width: 600px;
        }

        /* ===== STACK ===== */
        .stack-grid {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 860px) { .stack-grid { grid-template-columns: 1fr; } }

        .tree-window {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .tree-body {
            padding: 1.5rem 1.8rem;
            font-family: var(--mono);
            font-size: 0.8rem;
            line-height: 2;
            color: var(--text-dim);
            overflow-x: auto;
        }

        .tree-body .dir { color: var(--violet-soft); }
        .tree-body .file { color: var(--text); }
        .tree-body .hl-amber { color: var(--amber); }

        .tool-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-content: flex-start;
            margin-top: 0.5rem;
        }

        .tool-chip {
            font-family: var(--mono);
            font-size: 0.72rem;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-dim);
            transition: 0.2s;
        }

        .tool-chip:hover {
            border-color: var(--violet-soft);
            color: var(--text);
            transform: translateY(-1px);
        }

        /* ===== EXPERIENCE ===== */
        .log-window {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.8rem 2rem;
        }

        .log-entry {
            padding: 1.2rem 0;
            border-bottom: 1px dashed var(--border);
        }

        .log-entry:last-child { border-bottom: none; padding-bottom: 0; }
        .log-entry:first-child { padding-top: 0; }

        .log-head {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0.7rem;
            margin-bottom: 0.4rem;
        }

        .log-tag {
            font-family: var(--mono);
            font-size: 0.65rem;
            color: var(--bg);
            background: var(--amber);
            padding: 0.1rem 0.5rem;
            border-radius: 4px;
            font-weight: 700;
        }

        .log-tag.oss { background: var(--violet-soft); }

        .log-role { font-weight: 700; font-size: 1rem; }
        .log-meta { font-family: var(--mono); font-size: 0.7rem; color: var(--text-dimmer); }

        .log-entry ul {
            list-style: none;
            padding-left: 0;
            margin-top: 0.4rem;
        }

        .log-entry li {
            color: var(--text-dim);
            font-size: 0.85rem;
            padding-left: 1.3rem;
            position: relative;
            margin-bottom: 0.25rem;
        }

        .log-entry li::before {
            content: '├─';
            position: absolute;
            left: 0;
            color: var(--text-dimmer);
            font-family: var(--mono);
        }

        .log-entry li:last-child::before { content: '└─'; }

        /* ===== PROJECTS ===== */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.5rem;
        }

        .pcard {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: all var(--transition);
        }

        .pcard:hover {
            border-color: var(--border-strong);
            transform: translateY(-6px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .pcard-bar {
            background: var(--surface-2);
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .pcard-bar-left { display: flex; gap: 0.4rem; }
        .pcard-fname { font-family: var(--mono); font-size: 0.65rem; color: var(--text-dimmer); }

        .pcard-status {
            font-family: var(--mono);
            font-size: 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-weight: 700;
        }

        .pcard-status.live { color: var(--green); }
        .pcard-status.live .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
            animation: pulse 2s infinite;
        }

        .pcard-status.pub { color: var(--violet-soft); }

        .pcard-body { padding: 1.3rem 1.5rem; }
        .pcard-icon { font-size: 1.6rem; margin-bottom: 0.4rem; }
        .pcard-title { font-weight: 700; font-size: 1.05rem; margin-bottom: 0.3rem; }

        .pcard-desc {
            color: var(--text-dim);
            font-size: 0.82rem;
            line-height: 1.6;
            margin-bottom: 0.8rem;
        }

        .pcard-metric {
            font-family: var(--mono);
            font-size: 0.72rem;
            color: var(--amber);
            margin-bottom: 0.8rem;
        }

        .pcard-tech {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin-bottom: 0.8rem;
        }

        .pcard-tech span {
            font-family: var(--mono);
            font-size: 0.6rem;
            background: rgba(124, 92, 255, 0.08);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 0.15rem 0.5rem;
            border-radius: 20px;
        }

        .pcard-links {
            display: flex;
            gap: 1.2rem;
            border-top: 1px solid var(--border);
            padding-top: 0.8rem;
        }

        .pcard-links a {
            font-family: var(--mono);
            font-size: 0.72rem;
            color: var(--violet-soft);
            display: flex;
            align-items: center;
            gap: 0.3rem;
            transition: 0.2s;
        }

        .pcard-links a:hover { color: var(--amber); }

        .pcard.featured { grid-column: span 2; }

        @media (max-width: 860px) {
            .pcard.featured { grid-column: span 1; }
            .project-grid { grid-template-columns: 1fr; }
        }

        .pcard.featured .pcard-body { padding: 1.5rem 2rem; }

        .pcard .flow-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem 0.8rem;
            font-family: var(--mono);
            font-size: 0.68rem;
            color: var(--text-dimmer);
            margin: 0.6rem 0;
            padding: 0.5rem 0.8rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
        }

        .pcard .flow-row span { display: inline-flex; align-items: center; gap: 0.3rem; }
        .pcard .flow-row .arrow { color: var(--violet-soft); }

        /* ===== CERTIFICATIONS ===== */
        .cert-table-wrap {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            overflow-x: auto;
        }

        .cert-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
        }

        .cert-table th {
            font-family: var(--mono);
            text-align: left;
            font-size: 0.65rem;
            letter-spacing: 0.05em;
            color: var(--text-dimmer);
            text-transform: uppercase;
            padding: 0.7rem 1.2rem;
            border-bottom: 1px solid var(--border-strong);
        }

        .cert-table td {
            padding: 0.8rem 1.2rem;
            border-bottom: 1px solid var(--border);
            color: var(--text-dim);
        }

        .cert-table tr:hover td {
            background: rgba(124, 92, 255, 0.04);
            color: var(--text);
        }

        .cert-table td:first-child { color: var(--text); font-weight: 600; }

        /* ===== LEADERSHIP ===== */
        .ach-window {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.6rem 2rem;
            font-family: var(--mono);
            font-size: 0.85rem;
            line-height: 2.1;
        }

        .ach-window .gt { color: var(--green); }
        .ach-window .sub {
            color: var(--text-dimmer);
            display: block;
            padding-left: 1.6rem;
            font-size: 0.8rem;
        }

        /* ===== GITHUB ===== */
        .github-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            text-align: center;
        }

        .gh-stats {
            display: flex;
